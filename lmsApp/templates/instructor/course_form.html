{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[calc(100vh-160px)] py-8">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-2xl">
        
        <!-- Toggle Switcher (Only show when creating a new course, not editing) -->
        {% if not course %}
        <div class="mb-6 flex justify-center space-x-2 bg-gray-100 p-1.5 rounded-xl max-w-sm mx-auto">
            <span class="flex-1 text-center py-2 px-3 rounded-lg bg-white shadow-sm font-semibold text-xs text-indigo-600 cursor-default">
                <i class="fas fa-edit mr-1"></i> Manual Form
            </span>
            <a href="{% url 'course_create_from_pdf' %}" class="flex-1 text-center py-2 px-3 rounded-lg text-gray-500 hover:text-gray-800 font-semibold text-xs transition flex items-center justify-center">
                <i class="fas fa-file-pdf mr-1 text-red-500"></i> Import from PDF
            </a>
        </div>
        {% endif %}

        <h2 class="text-3xl font-bold text-center text-gray-800 mb-6 flex items-center justify-center">
            <i class="fas fa-edit mr-3 text-indigo-600"></i> {{ page_title }}
        </h2>

        <form method="post" enctype="multipart/form-data" class="space-y-4" novalidate>
            {% csrf_token %}
            {{ form.media }}
            {{ form|crispy }}
            <button type="submit" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 flex items-center justify-center">
                <i class="fas fa-save mr-2"></i> Save Course
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="{% url 'dashboard' %}" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-gray-700 bg-gray-200 hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500">
                <i class="fas fa-arrow-left mr-2"></i> Back to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
