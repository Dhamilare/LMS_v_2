{% load crispy_forms_tags %}

<div class="p-4">
    <!-- Quick action header inside modal when creating a course -->
    {% if not course %}
    <div class="mb-4 p-3 bg-indigo-50 border border-indigo-100 rounded-lg flex items-center justify-between">
        <span class="text-xs text-indigo-900 font-medium">Want to auto-generate from a document?</span>
        <a href="{% url 'course_create_from_pdf' %}" class="inline-flex items-center text-xs font-semibold text-indigo-700 hover:text-indigo-900 bg-white px-2.5 py-1 rounded border border-indigo-200 shadow-sm transition">
            <i class="fas fa-wand-magic-sparkles mr-1 text-purple-600"></i> Import PDF
        </a>
    </div>
    {% endif %}

    <h2 class="text-3xl font-bold text-center text-gray-800 mb-6 flex items-center justify-center">
        <i class="fas fa-edit mr-3 text-indigo-600"></i> {{ page_title }}
    </h2>

    <form method="post" enctype="multipart/form-data" class="space-y-4" action="{% if course %}{% url 'course_update' slug=course.slug %}{% else %}{% url 'course_create' %}{% endif %}">
        {% csrf_token %}
        {{ form.media }}
        {{ form|crispy }}
        <button type="submit" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 flex items-center justify-center">
            <i class="fas fa-save mr-2"></i> Save Course
        </button>
    </form>
</div>
